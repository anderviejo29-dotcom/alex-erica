<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#191b18">
    <meta
      name="description"
      content="Una canción, una historia y un momento para guardar para siempre."
    >
    <title>Una canción para nosotros</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Allura&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="experience">
      <header class="topbar">
        <span class="topbar__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M19 12H5m0 0 6.5-6.5M5 12l6.5 6.5" />
          </svg>
        </span>
        <p class="topbar__label">UN RECUERDO NUESTRO</p>
        <span class="topbar__ornament" aria-hidden="true">•••</span>
      </header>

      <section class="album" aria-labelledby="couple-names">
        <figure class="album__art">
          <img
            src="Pareja.jpeg"
            alt="Alex y Erica, juntos en un momento especial"
            fetchpriority="high"
          >
          <span class="album__edition">PARA SIEMPRE, EN ESTA CANCIÓN</span>
        </figure>

        <div class="album__caption">
          <div class="album__copy">
            <p class="eyebrow">NUESTRA HISTORIA</p>
            <h1 id="couple-names">Alex <span aria-label="y">&amp;</span> Erica</h1>
            <p class="album__message">
              Una canción, una historia y un momento que quiero guardar para siempre.
            </p>
          </div>
          <span class="heart" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M20.3 5.9a5 5 0 0 0-7.1 0L12 7.1l-1.2-1.2a5 5 0 0 0-7.1 7.1l1.2 1.2L12 21l7.1-6.8 1.2-1.2a5 5 0 0 0 0-7.1Z" />
            </svg>
          </span>
        </div>
      </section>

      <section class="player" aria-label="Reproductor de música">
        <div class="player__track">
          <div>
            <h2 class="player__title">Lying From You</h2>
            <p class="player__artist">Linkin Park <span>·</span> Meteora</p>
          </div>
          <span class="player__quality">UNA CANCIÓN</span>
        </div>

        <div class="timeline">
          <label class="visually-hidden" for="seek">Posición de la canción</label>
          <input
            class="timeline__seek"
            id="seek"
            type="range"
            min="0"
            max="1000"
            value="0"
            step="1"
            disabled
          >
          <div class="timeline__times" aria-hidden="true">
            <span id="elapsed">0:00</span>
            <span id="duration">--:--</span>
          </div>
        </div>

        <div class="controls">
          <span class="controls__spacer" aria-hidden="true"></span>
          <button
            class="controls__play"
            id="play-toggle"
            type="button"
            aria-label="Reproducir"
            aria-pressed="false"
          >
            <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 5.8c0-.8.9-1.3 1.6-.9l10 6.2a1 1 0 0 1 0 1.7l-10 6.2c-.7.5-1.6 0-1.6-.9V5.8Z" />
            </svg>
            <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" />
            </svg>
          </button>
          <span class="player__note">TÓCALA CUANDO QUIERAS</span>
        </div>

        <div class="soundwave" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <p class="player__status" id="player-status" role="status" aria-live="polite"></p>
      </section>

      <p class="closing">Hecho con cariño, para nosotros.</p>

      <audio id="audio" preload="metadata">
        <source
          src="Lying%20From%20You%20-%20Linkin%20Park%20(Meteora).mp3"
          type='audio/mp4; codecs="mp4a.40.2"'
        >
        Tu navegador no puede reproducir audio HTML5.
      </audio>
    </main>
  </body>
</html>
